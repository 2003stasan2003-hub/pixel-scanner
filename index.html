<!DOCTYPE html>
<html lang="uk">
<head>
    <!-- Створено: 14.11.2026, 17:00 -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ПІКСЕЛЬ-СКАНЕР</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd"></script>
</head>
<body>

    <div class="game-wrapper">
        <header class="header-panel">
            <div class="score-board">ОЧКИ: <span id="score-value">0</span></div>
            <!-- Кнопка перемикання режимів -->
            <button id="mode-btn" class="pixel-mode-btn">РЕЖИМ: АВТО</button>
        </header>

        <!-- Вікно камери з підтримкою кліку/торкання -->
        <div class="camera-container" id="camera-container">
            <video id="webcam" autoplay playsinline muted></video>
            <!-- Червона піксельна рамка -->
            <div id="detection-box" class="hidden-box">
                <span id="box-label">ЦІЛЬ</span>
            </div>
        </div>

        <footer class="footer-controls">
            <div id="result-display">ІНІЦІАЛІЗАЦІЯ...</div>
        </footer>
    </div>

    <script src="app.js"></script>
</body>
</html>
